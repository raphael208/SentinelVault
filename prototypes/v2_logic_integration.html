<!DOCTYPE html>
<html>
<head>
    <title>Proto 2</title>
    <style>
        body { background: #1e1e2f; color: white; font-family: sans-serif; text-align: center; }
        .bar { width: 300px; height: 10px; background: #333; margin: 10px auto; border-radius: 5px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: red; transition: 0.3s; }
    </style>
</head>
<body>
    <h2>Phase 2: Entropy Engine</h2>
    <input type="text" id="p" placeholder="Enter password...">
    <div class="bar"><div id="progress"></div></div>
    <p id="v">ENTROPY: 0 bits</p>

    <script>
        document.getElementById('p').oninput = function() {
            let pwd = this.value;
            let charset = 0;
            if (/[a-z]/.test(pwd)) charset += 26;
            if (/[A-Z]/.test(pwd)) charset += 26;
            if (/[0-9]/.test(pwd)) charset += 10;
            
            let entropy = pwd.length > 0 ? (pwd.length * Math.log2(charset)).toFixed(2) : 0;
            document.getElementById('v').innerText = "ENTROPY: " + entropy + " bits";
            
            let per = Math.min((entropy / 60) * 100, 100);
            document.getElementById('progress').style.width = per + "%";
            document.getElementById('progress').style.background = per < 50 ? "red" : "green";
        };
    </script>
</body>
</html>
